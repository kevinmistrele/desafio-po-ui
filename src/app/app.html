<aside class="sidebar">
  <p class="brand">Desafio PO UI<br />TOTVS</p>

  <nav aria-label="Componentes">
    <ul class="nav">
      @for (page of pages; track page.id) {
        <li>
          <button
            type="button"
            class="nav-item"
            [attr.aria-current]="page === activePage() ? 'page' : null"
            (click)="activePage.set(page)"
          >
            {{ page.label }}
          </button>
        </li>
      }
    </ul>
  </nav>
</aside>

<main class="main">
  <p class="breadcrumb">Playground / {{ activePage().label }}</p>

  <div class="page" [hidden]="activePage().id !== 'switch'">
    <km-switch-playground />
  </div>
  <div class="page" [hidden]="activePage().id !== 'select'">
    <km-select-playground />
  </div>
</main>
